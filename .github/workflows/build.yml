name: Build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        pandas-series: ["2.2", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Pin pandas
        run: |
          if [ "${{ matrix.pandas-series }}" = "2.2" ]; then
            uv run python -m pip install "pandas>=2.2,<2.3"
          else
            uv run python -m pip install --pre "pandas>=3,<4"
          fi
      - name: Run unit tests
        run: uv run pytest -m "unit" -q
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.pandas-series == '2.2'
        uses: codecov/codecov-action@v2
